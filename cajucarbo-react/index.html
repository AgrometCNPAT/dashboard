<!-- ===================== COMPONENTES REACT (JSX transpilado em tempo real) =====================
     Observação: o código-fonte "de verdade" destes componentes vive em js/react/*.jsx —
     este bloco é uma cópia embutida para que o site funcione ao ser aberto diretamente
     como arquivo local, sem precisar de um servidor (o Babel não consegue buscar arquivos
     .jsx externos via file://). Ao editar a lógica, edite os .jsx e regenere este arquivo. -->
<script type="text/babel" data-presets="react">
(function(){
/* ---- common.jsx ---- */
/* =========================================================
   common.jsx
   Componentes compartilhados: intro 3D, navegação, PlotlyChart,
   estados vazios e pequenos helpers de exibição.
   ========================================================= */

var { useEffect, useRef, useState } = React;
var CC = window.CajuCarbo;

function fmt(v, decimals=1){
  return (v === null || v === undefined || isNaN(v))
    ? "—"
    : v.toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

/** Wrapper genérico para qualquer gráfico Plotly. `draw` recebe o nó DOM. */
function PlotlyChart({ draw, deps = [], className = "chart-box" }){
  const ref = useRef(null);
  useEffect(() => {
    if(ref.current) draw(ref.current);
    return () => { if(ref.current && ref.current.data) Plotly.purge(ref.current); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, deps);
  return <div ref={ref} className={className}></div>;
}

function CountUp({ value, decimals=0 }){
  const ref = useRef(null);
  useEffect(() => {
    if(ref.current && typeof value === "number") CC.countUp(ref.current, value, { decimals });
  }, [value]);
  return <span ref={ref} className="count-up">{typeof value === "number" ? "0" : "—"}</span>;
}

function EmptyState({ title, desc }){
  return (
    <div className="empty-state">
      <h4>{title}</h4>
      <p>{desc}</p>
    </div>
  );
}

function StatRow({ pairs, formatValue }){
  return (
    <div style={{display:"flex", gap:18, flexWrap:"wrap", marginBottom:14}}>
      {pairs.map(([label, val], i) => (
        <div key={i}>
          <div style={{fontSize:11, color:"var(--cinza-400)", fontWeight:600}}>{label}</div>
          <div style={{fontFamily:"var(--fonte-num)", fontSize:18, fontWeight:700, color:"var(--azul-900)"}}>{formatValue ? formatValue(val, label) : fmt(val)}</div>
        </div>
      ))}
    </div>
  );
}

function BigStat({ value, unit }){
  return (
    <div style={{fontFamily:"var(--fonte-num)", fontSize:30, fontWeight:700, color:"var(--azul-900)"}}>
      {fmt(value)}<small style={{fontSize:14, color:"var(--cinza-400)", fontWeight:600}}> {unit}</small>
    </div>
  );
}

--------------------------------------------------------- */
function IntroOverlay({ hidden }){
  const canvasHostRef = useRef(null);

  useEffect(() => {
    if(hidden || !canvasHostRef.current || !window.THREE) return;
    const scene = CC.createParticleNetwork3D(canvasHostRef.current, {
      count: 36, color: 0xffffff, linkColor: 0x2E8B57, radius: 6.5, cameraZ: 8
    });
    return () => scene.dispose();
  }, [hidden]);

  return (
    <div className={"intro" + (hidden ? " is-hidden" : "")}>
      <div className="intro__canvas" ref={canvasHostRef}></div>
      <div className="intro__content">
        <img src="../brand/cajucarbo-logo.png" alt="CajuCarbo" className="intro__logo" />
        <div className="intro__mark">EMBRAPA</div>
        <div className="intro__title">CajuCarbo</div>

        <p className="intro__desc">A plataforma transforma dados ambientais em informações para análise científica.</p>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Alternador de fonte de dados (consome o registro em datasets.js)
--------------------------------------------------------- */
function DatasetSwitcher({ datasetId, onChange }){
  const datasets = CC.CC_DATASETS;
  return (
    <div className="dataset-switcher">
      <label htmlFor="dataset-select">Fonte de dados</label>

function Topbar({ activeItem, status, onToggleNav, datasetId, onDatasetChange }){
  const pillClass = status === "ready" ? "status-pill is-online" : (status === "error" ? "status-pill" : "status-pill is-waiting");

function toLocalDateString(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}

function monthKeyFromValue(value){
  if(!value) return "";
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return "";
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
}

function parseTimeMinutes(value){
  if(!value) return 0;
  const [hours, minutes] = String(value).split(":").map(Number);
  return (Number.isFinite(hours) ? hours : 0) * 60 + (Number.isFinite(minutes) ? minutes : 0);
}

function buildTemporalFilterOptions(rows){
  const valid = (rows || []).filter(r => r && r.timestamp);
  if(!valid.length) return { minDate: null, maxDate: null, years: [], months: [], days: [] };

  const dates = valid.map(r => new Date(r.timestamp)).filter(d => !Number.isNaN(d.getTime()));
  const minTime = dates.reduce((min, d) => (d.getTime() < min ? d.getTime() : min), dates[0].getTime());
  const maxTime = dates.reduce((max, d) => (d.getTime() > max ? d.getTime() : max), dates[0].getTime());
  const minDate = new Date(minTime);
  const maxDate = new Date(maxTime);

  const years = Array.from(new Set(dates.map(d => d.getFullYear()))).sort((a,b)=>a-b);
  const months = Array.from(new Set(dates.map(d => monthKeyFromValue(d)))).sort();
  const days = Array.from(new Set(dates.map(d => toLocalDateString(d)))).sort();

  return { minDate, maxDate, years, months, days };
}

function formatTemporalFilterLabel(filter, options = {}){
  if(!filter || filter.granularity === "all") return "Todos os dados";
  if(filter.granularity === "day") return filter.day ? `Dia ${filter.day.split("-").reverse().join("/")}` : "Dia selecionado";
  if(filter.granularity === "week") {
    if(filter.weekStart && filter.weekEnd) return `${filter.weekStart.split("-").reverse().join("/")} — ${filter.weekEnd.split("-").reverse().join("/")}`;
    return "Semana selecionada";
  }
  if(filter.granularity === "month") return filter.month ? new Date(`${filter.month}-01T00:00:00`).toLocaleString("pt-BR", { month: "long", year: "numeric" }) : "Mês selecionado";
  if(filter.granularity === "year") return filter.year ? String(filter.year) : "Ano selecionado";
  if(filter.granularity === "custom") {
    if(filter.customStart && filter.customEnd) return `${filter.customStart.split("-").reverse().join("/")} — ${filter.customEnd.split("-").reverse().join("/")}`;
    return "Intervalo personalizado";
  }
  return "Período selecionado";
}

function applyTemporalFilter(rows, filter){
  if(!rows || !rows.length) return [];
  const normalized = rows.filter(r => r && r.timestamp);
  if(!normalized.length) return [];

  const options = buildTemporalFilterOptions(normalized);
  const defaultDay = options.days[options.days.length - 1] || toLocalDateString(options.maxDate);
  const defaultMonth = options.months[options.months.length - 1] || monthKeyFromValue(options.maxDate);
  const defaultYear = options.years[options.years.length - 1] || new Date(options.maxDate).getFullYear();

  const selectedDay = filter && filter.day ? filter.day : defaultDay;
  const selectedMonth = filter && filter.month ? filter.month : defaultMonth;
  const selectedYear = filter && filter.year ? Number(filter.year) : Number(defaultYear);

  return normalized.filter(row => {
    const d = new Date(row.timestamp);
    if(Number.isNaN(d.getTime())) return false;

    const dateKey = toLocalDateString(d);
    const month = monthKeyFromValue(d);
    const year = d.getFullYear();
    const hourMin = parseTimeMinutes(filter && filter.hourStart ? filter.hourStart : "00:00");
    const hourMax = parseTimeMinutes(filter && filter.hourEnd ? filter.hourEnd : "23:59");
    const currentMinutes = d.getHours() * 60 + d.getMinutes();

    if(filter && filter.hourStart && filter.hourEnd){
      if(currentMinutes < hourMin || currentMinutes > hourMax) return false;
    }

    switch(filter && filter.granularity ? filter.granularity : "all"){
      case "all":
        return true;
      case "day":
        return dateKey === selectedDay;
      case "week": {
        const weekStart = filter && filter.weekStart ? filter.weekStart : selectedDay;
        const weekEnd = filter && filter.weekEnd ? filter.weekEnd : toLocalDateString(new Date(new Date(weekStart).getTime() + 6 * 86400000));
        return dateKey >= weekStart && dateKey <= weekEnd;
      }
      case "month":
        return month === selectedMonth;
      case "year":
        return year === selectedYear;
      case "custom":
        return (!filter.customStart || dateKey >= filter.customStart) && (!filter.customEnd || dateKey <= filter.customEnd);
      default:
        return true;
    }
  });
}

function TemporalFilterBar({ rows, filter, onChange, datasetLabel }){
  const options = buildTemporalFilterOptions(rows || []);
  const setFilter = (patch) => onChange({ ...filter, ...patch });
  const activeLabel = formatTemporalFilterLabel(filter, options);

  const monthOptions = (options.months || []).map(value => {
    const [year, month] = value.split("-");
    const label = new Date(Number(year), Number(month) - 1, 1).toLocaleString("pt-BR", { month: "long", year: "numeric" });
    return <option key={value} value={value}>{label}</option>;
  });

  const yearOptions = (options.years || []).map(value => <option key={value} value={value}>{value}</option>);

  const activeRecords = rows ? rows.length : 0;
  const currentGranularity = filter && filter.granularity ? filter.granularity : "all";

  return (
    <div className="panel reveal" style={{ marginBottom: 20 }}>
      <div className="panel__title" style={{ display: "flex", justifyContent: "space-between", gap: 12, alignItems: "center", flexWrap: "wrap" }}>
        <h3>Período de análise</h3>
        <span className="meta" style={{ fontSize: 11 }}>{datasetLabel || "Base ativa"}</span>
      </div>

      <div style={{ display: "grid", gap: 16 }}>
        <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
          {[
            { id: "all", label: "Todos" },
            { id: "day", label: "Diário" },
            { id: "week", label: "Semanal" },
            { id: "month", label: "Mensal" },
            { id: "year", label: "Anual" },
            { id: "custom", label: "Personalizado" }
          ].map(item => (
            <button
              key={item.id}
              type="button"
              onClick={() => setFilter({ granularity: item.id })}
              style={{
                border: currentGranularity === item.id ? "1px solid rgba(18,72,160,0.45)" : "1px solid rgba(148,163,184,0.35)",
                background: currentGranularity === item.id ? "rgba(18,72,160,0.12)" : "rgba(255,255,255,0.04)",
                color: currentGranularity === item.id ? "var(--azul-900)" : "var(--cinza-700)",
                padding: "8px 12px",
                borderRadius: 999,
                fontWeight: 700,
                cursor: "pointer",
                fontSize: 12,
                letterSpacing: "0.04em",
                textTransform: "uppercase"
              }}
            >
              {item.label}
            </button>
          ))}
        </div>

        <div style={{ display: "flex", flexWrap: "wrap", gap: 12, alignItems: "end" }}>
          {currentGranularity === "day" && (
            <label style={{ display: "grid", gap: 6 }}>
              <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Data</span>
              <input type="date" value={filter.day || ""} onChange={(e) => setFilter({ granularity: "day", day: e.target.value })} />
            </label>
          )}

          {currentGranularity === "week" && (
            <>
              <label style={{ display: "grid", gap: 6 }}>
                <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Início</span>
                <input type="date" value={filter.weekStart || ""} onChange={(e) => setFilter({ granularity: "week", weekStart: e.target.value, weekEnd: e.target.value ? toLocalDateString(new Date(new Date(e.target.value).getTime() + 6 * 86400000)) : "" })} />
              </label>
              <label style={{ display: "grid", gap: 6 }}>
                <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Fim</span>
                <input type="date" value={filter.weekEnd || ""} onChange={(e) => setFilter({ granularity: "week", weekStart: filter.weekStart || e.target.value, weekEnd: e.target.value })} />
              </label>
            </>
          )}

          {currentGranularity === "month" && (
            <label style={{ display: "grid", gap: 6 }}>
              <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Mês</span>
              <select value={filter.month || ""} onChange={(e) => setFilter({ granularity: "month", month: e.target.value })}>
                <option value="">Selecione</option>
                {monthOptions}
              </select>
            </label>
          )}

          {currentGranularity === "year" && (
            <label style={{ display: "grid", gap: 6 }}>
              <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Ano</span>
              <select value={filter.year || ""} onChange={(e) => setFilter({ granularity: "year", year: e.target.value })}>
                <option value="">Selecione</option>
                {yearOptions}
              </select>
            </label>
          )}

          {currentGranularity === "custom" && (
            <>
              <label style={{ display: "grid", gap: 6 }}>
                <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Início</span>
                <input type="date" value={filter.customStart || ""} onChange={(e) => setFilter({ granularity: "custom", customStart: e.target.value })} />
              </label>
              <label style={{ display: "grid", gap: 6 }}>
                <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Fim</span>
                <input type="date" value={filter.customEnd || ""} onChange={(e) => setFilter({ granularity: "custom", customEnd: e.target.value })} />
              </label>
            </>
          )}

          <label style={{ display: "grid", gap: 6 }}>
            <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Hora inicial</span>
            <input type="time" value={filter.hourStart || "00:00"} onChange={(e) => setFilter({ hourStart: e.target.value })} />
          </label>

          <label style={{ display: "grid", gap: 6 }}>
            <span style={{ fontSize: 11, color: "var(--cinza-400)", fontWeight: 700, textTransform: "uppercase" }}>Hora final</span>
            <input type="time" value={filter.hourEnd || "23:59"} onChange={(e) => setFilter({ hourEnd: e.target.value })} />
          </label>
        </div>

        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", gap: 12, flexWrap: "wrap" }}>
          <div style={{ fontSize: 12, color: "var(--cinza-400)" }}>
            <strong style={{ color: "var(--azul-900)" }}>Período analisado:</strong> {activeLabel}
          </div>
          <div style={{ fontSize: 12, color: "var(--cinza-400)" }}>
            <strong style={{ color: "var(--azul-900)" }}>Registros analisados:</strong> {activeRecords.toLocaleString("pt-BR")}
          </div>
        </div>
      </div>
    </div>
  );
}

window.CajuCarbo = window.CajuCarbo || {};
Object.assign(window.CajuCarbo, {
  fmt, PlotlyChart, CountUp, EmptyState, StatRow, BigStat,
  IntroOverlay, Sidebar, Topbar, NAV_ITEMS,
  TemporalFilterBar, buildTemporalFilterOptions, applyTemporalFilter, formatTemporalFilterLabel
});

})();
</script>

<script type="text/babel" data-presets="react">
(function(){
/* ---- sections.jsx ---- */
/* =========================================================
   sections.jsx
   As 10 seções do dashboard + Produção Nacional, como componentes.
   — Gráficos limpos, fluidos e altamente informativos para
     análise agronômica e tomada de decisão no campo.
   ========================================================= */

var { useEffect, useRef, useState: useStateS } = React;
var { fmt, PlotlyChart, CountUp, EmptyState, StatRow, BigStat } = window.CajuCarbo;
var NUMERIC_FIELD_LABELS = window.CajuCarbo.NUMERIC_FIELD_LABELS;

function getField(normalized, field){
  return normalized.map(r => r[field]);
}
function onlyNumbers(arr){ return window.CajuCarbo.onlyNumbers(arr); }

function formatScatterMetric(value, decimals=3){
  return value === null || value === undefined || isNaN(value)
    ? "—"
    : Number(value).toLocaleString("pt-BR", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function scatterInterpretation(metrics, xLabel, yLabel){
  if(metrics.count < 5 || metrics.r === null) return "Dados insuficientes para interpretar a relação entre as variáveis selecionadas.";
  const direction = metrics.r < 0 ? "Relação inversa" : "Relação direta";
  const magnitude = Math.abs(metrics.r) >= 0.7 ? "forte" : Math.abs(metrics.r) >= 0.4 ? "moderada" : "fraca";
  return `${direction} ${magnitude} entre ${xLabel.toLowerCase()} e ${yLabel.toLowerCase()}.`;
}

function sumField(normalized, field){
  const vals = onlyNumbers(getField(normalized, field));
  return vals.length ? vals.reduce((a,b)=>a+b,0) : null;
}

function isDailySeries(normalized){
  const days = normalized.map(row => row.timestamp?.slice(0, 10)).filter(Boolean);
  return days.length > 0 && new Set(days).size === days.length;
}

function totalPrecipitation(normalized){
  const preferredField = isDailySeries(normalized) ? "tp_mm_dia" : "tp_mm";
  return sumField(normalized, preferredField)
    ?? sumField(normalized, "tp_mm_dia")
    ?? sumField(normalized, "tp_mm");
}

function solarSeries(normalized){
  if(!isDailySeries(normalized)){
    return { values: getField(normalized, "ssrd_wm2"), unit: "W/m²", name: "Radiação Solar Global (SSRD)" };
  }
  return {
    values: getField(normalized, "ssrd_mjm2_dia").map(value => Number(value) * 1000000 / 86400),
    unit: "W/m²",
    name: "Radiação Solar Global (média diária)"
  };
}

function recordLabel(normalized){
  return isDailySeries(normalized) ? "observações diárias" : "observações horárias";
}

function lastValid(normalized, field){
  const vals = onlyNumbers(getField(normalized, field));
  return vals.length ? vals[vals.length-1] : null;
}

function timestamps(normalized){ return normalized.map(r => r.timestamp); }

function formatPeriodRange(meta){
  if(!meta.periodStart || !meta.periodEnd) return "Não identificado nos dados";
  return `${meta.periodStart} — ${meta.periodEnd}`;
}

function locationLabel(normalized){
  const lat = normalized.find(r=>r.latitude!==null)?.latitude;
  const lon = normalized.find(r=>r.longitude!==null)?.longitude;
  if(lat === undefined || lon === undefined) return "Não disponível";
  return `${fmt(lat,3)}, ${fmt(lon,3)}`;
}

/** Componente auxiliar para caixas de contexto agronômico */
function AgroGuide({ title, badge, badgeType="blue", items = [], children }){
  const modifier = badgeType === "green" ? "chart-agro-guide--green" : badgeType === "amber" ? "chart-agro-guide--amber" : "";
  const tagClass = `badge-tag badge-tag--${badgeType}`;
  return (
    <div className={`chart-agro-guide ${modifier}`}>
      <div className="chart-agro-guide__header">
        {badge && <span className={tagClass}>{badge}</span>}
        <span>{title}</span>
      </div>
      {children}
      {items.map((it, idx) => (
        <p key={idx}><strong>{it.label}:</strong> {it.text}</p>
      ))}
    </div>
  );
}

function ChartCaption({ title, text }){
  return (
    <div className="chart-caption">
      <div className="chart-caption__title">{title}</div>
      <div className="chart-caption__text">{text}</div>
    </div>
  );
}

/* =========================== 03 — METEOROLOGIA =========================== */
function MeteorologiaSection({ data }){
  const { hasData, normalized, statistics } = data;
  const [varA, setVarA] = useStateS("t2m_c");
  const [varB, setVarB] = useStateS("rh");
  if(!hasData) return <><Header n="03" t="Meteorologia" d="Séries temporais, comparação entre variáveis e VPD." /><EmptyState title="Carregando dados..." desc="Aguardando o processamento dos dados." /></>;

  const optsA = ["t2m_c","rh","sp_hpa","wind_speed","d2m_c","tp_mm_dia"];
  const optsB = ["rh","t2m_c","vpd","ssrd_wm2","tp_mm_dia","wind_speed"];
  const scatterX = getField(normalized, varA);
  const scatterY = getField(normalized, varB);
  const scatterXLabel = NUMERIC_FIELD_LABELS[varA];
  const scatterYLabel = NUMERIC_FIELD_LABELS[varB];
  const scatterMetrics = window.CajuCarbo.calculateScatterMetrics(scatterX, scatterY);

  return (
    <>
      <Header n="03" t="Meteorologia" d="Dinâmica das variáveis atmosféricas, correlações pareadas e déficit de pressão de vapor (VPD)." />
      <div className="filters-bar reveal">
        <div className="filter-field"><label>Variável Primária (Eixo Y Esquerdo)</label>
          <select value={varA} onChange={e=>setVarA(e.target.value)}>
            {optsA.map(f=><option key={f} value={f}>{NUMERIC_FIELD_LABELS[f]}</option>)}
          </select>
        </div>
        <div className="filter-field"><label>Variável Secundária (Eixo Y Direito)</label>
          <select value={varB} onChange={e=>setVarB(e.target.value)}>
            {optsB.map(f=><option key={f} value={f}>{NUMERIC_FIELD_LABELS[f]}</option>)}
          </select>
        </div>
      </div>

      <div className="panel reveal" style={{marginBottom:20}}>
        <div className="panel__title"><h3>Evolução Temporal Sincronizada</h3></div>
        <PlotlyChart className="chart-box tall" deps={[varA,varB]} draw={(n)=>window.CajuCarbo.renderTimeSeries(n, timestamps(normalized), [
          { name: NUMERIC_FIELD_LABELS[varA], values: getField(normalized,varA) },
          { name: NUMERIC_FIELD_LABELS[varB], values: getField(normalized,varB) }
        ], {
          dualAxis: true,
          xTitle: "Data / Período de Observação",
          yTitle: NUMERIC_FIELD_LABELS[varA],
          y2Title: NUMERIC_FIELD_LABELS[varB]
        })} />
        <AgroGuide title="Análise Temporal Cruzada" badge="Comportamento" badgeType="blue" items={[
          { label: "Leitura do Gráfico", text: "As duas variáveis são traçadas em escalas independentes para visualização nítida de ciclos diurnos, frentes meteorológicas e correlações sazonais." }
        ]} />
      </div>

      <div className="grid grid-2 reveal-stagger">
        <div className="panel">
          <div className="panel__title"><h3>Dispersão e Tendência Linear</h3><span className="meta">R² / r</span></div>
          <StatRow
            pairs={[["R²", scatterMetrics.r2],["Correlação (r)", scatterMetrics.r],["Observações (n)", scatterMetrics.count]]}
            formatValue={(value, label) => label === "Observações (n)" ? value.toLocaleString("pt-BR") : formatScatterMetric(value)}
          />
          <PlotlyChart className="chart-box" deps={[varA,varB]} draw={(n)=>window.CajuCarbo.renderScatterCompare(n, scatterX, scatterY, scatterXLabel, scatterYLabel, timestamps(normalized))} />
          <AgroGuide title="Ajuste de Regressão Linear" badge="Estatística" badgeType="amber" items={[
            { label: "Interpretação", text: scatterInterpretation(scatterMetrics, scatterXLabel, scatterYLabel) },
            { label: "Indicadores", text: `R² = ${formatScatterMetric(scatterMetrics.r2)} · r = ${formatScatterMetric(scatterMetrics.r)} · n = ${scatterMetrics.count.toLocaleString("pt-BR")}` },
            { label: "Coeficiente de Determinação (R²)", text: "Mede o quanto a variação da variável Y é explicada pela variável X. Os pontos e a reta permanecem disponíveis para análise detalhada." }
          ]} />
        </div>

        <div className="panel">
          <div className="panel__title"><h3>Déficit de Pressão de Vapor (VPD)</h3><span className="meta">kPa</span></div>
          <StatRow pairs={[["Atual", lastValid(normalized,"vpd")],["Média", statistics.vpd?.mean],["Mínimo", statistics.vpd?.min],["Máximo", statistics.vpd?.max]]} />
          <PlotlyChart draw={(n)=>window.CajuCarbo.renderTimeSeries(n, timestamps(normalized), [{name:"VPD (Déficit de Pressão de Vapor)", values:getField(normalized,"vpd"), unit:"kPa"}], {
            fill:true,
            xTitle:"Data / Hora do Registro",
            yTitle:"Déficit de Pressão de Vapor — VPD (kPa)",
            tickformat:".2f"
          })} />
          <AgroGuide title="Fisiologia Foliar — VPD no Cajueiro" badge="Estresse Hídrico" badgeType="green" items={[
            { label: "Faixa Ótima (&lt; 1,2 kPa)", text: "Estômatos totalmente abertos, absorção plena de CO₂ para fotossíntese sem perda hídrica excessiva." },
            { label: "Faixa de Atenção (1,2 a 2,0 kPa)", text: "Início do fechamento estomático preventivo para evitar desidratação." },
            { label: "Estresse Crítico (&gt; 2,0 kPa)", text: "Fechamento estomático severo, paralisação fotossintética e abortamento de flores no pomar." }

/* =========================== 07 — ANÁLISE ESTATÍSTICA =========================== */
function EstatisticaSection({ data }){
  const { hasData, normalized, statistics } = data;
  const fields = ["t2m_c","rh","sp_hpa","wind_speed","tp_mm_dia","vpd"].filter(f => statistics[f]?.count);
  const [statVar, setStatVar] = useStateS(fields[0] || "t2m_c");
  if(!hasData) return <><Header n="07" t="Análise Estatística" d="Estatística descritiva, distribuições e correlação." /><EmptyState title="Carregando dados..." desc="Aguardando o processamento dos dados." /></>;

  const s = statistics;
  const matrix = fields.map(a => fields.map(b => {
    const r = window.CajuCarbo.pearsonCorrelation(getField(normalized,a), getField(normalized,b));
    return r === null ? 0 : +r.toFixed(2);
  }));

  return (
    <>
      <Header n="07" t="Análise Estatística Avançada" d="Estatística descritiva completa, histogramas de distribuição de frequência, boxplots e matriz de correlação de Pearson." />
      <div className="filters-bar reveal">
        <div className="filter-field"><label>Selecionar Variável para Histograma</label>
          <select value={statVar} onChange={e=>setStatVar(e.target.value)}>
            {fields.map(f=><option key={f} value={f}>{NUMERIC_FIELD_LABELS[f]}</option>)}
          </select>
        </div>
      </div>

      <div className="panel reveal" style={{marginBottom:20, overflowX:"auto"}}>
        <div className="panel__title"><h3>Resumo Estatístico Paramétrico e Não-Paramétrico</h3></div>
        <table className="data-table">
          <thead><tr><th>Variável</th><th>Amostras (N)</th><th>Ausentes</th><th>Média</th><th>Mediana</th><th>Desvio Padrão</th><th>Mínimo</th><th>Máximo</th><th>P25 (Q1)</th><th>P75 (Q3)</th></tr></thead>
          <tbody>
            {fields.map(f => { const d = s[f]; return (
              <tr key={f}>
                <td><strong>{NUMERIC_FIELD_LABELS[f]}</strong></td><td>{d.count.toLocaleString("pt-BR")}</td><td>{d.missing}</td>
                <td>{fmt(d.mean,2)}</td><td>{fmt(d.median,2)}</td><td>{fmt(d.stddev,2)}</td>
                <td>{fmt(d.min,2)}</td><td>{fmt(d.max,2)}</td><td>{fmt(d.p25,2)}</td><td>{fmt(d.p75,2)}</td>
              </tr>
            );})}
          </tbody>
        </table>
      </div>

      <div className="grid grid-2 reveal-stagger" style={{marginBottom:20}}>
        <div className="panel">
          <div className="panel__title"><h3>Distribuição de Frequência (Histograma)</h3></div>
          <PlotlyChart deps={[statVar]} draw={(n)=>window.CajuCarbo.renderHistogram(n, onlyNumbers(getField(normalized,statVar)), NUMERIC_FIELD_LABELS[statVar])} />
          <AgroGuide title="Análise de Distribuição" badge="Frequência" badgeType="blue" items={[
            { label: "Interpretação", text: `Mostra a concentração de leituras em cada intervalo de ${NUMERIC_FIELD_LABELS[statVar]}, permitindo identificar modas e assimetrias na série.` }
          ]} />
        </div>

        <div className="panel">
          <div className="panel__title"><h3>Boxplot Comparativo (Quartis e Outliers)</h3></div>
          <PlotlyChart draw={(n)=>window.CajuCarbo.renderBoxplot(n, fields.map(f=>({name:NUMERIC_FIELD_LABELS[f].split(" (")[0], values:onlyNumbers(getField(normalized,f))})))} />
          <AgroGuide title="Dispersão Interquartil" badge="Quartis" badgeType="amber" items={[
            { label: "Elementos do Boxplot", text: "Linha central = Mediana; Caixa = 50% dos dados centrais (Q1 a Q3); Hastes = Limites superior/inferior; Pontos soltos = Outliers estatísticos." }
          ]} />
        </div>
      </div>

      <div className="panel reveal">
        <div className="panel__title"><h3>Matriz de Correlação Linear de Pearson</h3></div>
        <PlotlyChart className="chart-box tall" draw={(n)=>window.CajuCarbo.renderCorrelationMatrix(n, fields.map(f=>NUMERIC_FIELD_LABELS[f].split(" (")[0]), matrix)} />
        <div className="corr-scale"><span>-1,00 (Inversa Forte)</span><div className="bar"></div><span>+1,00 (Direta Forte)</span></div>
        <AgroGuide title="Interpretação da Matriz de Correlação" badge="Pearson r" badgeType="green" items={[
          { label: "Valores Próximos a +1,0 (Verde)", text: "Forte correlação direta: quando uma variável cresce, a outra tende a crescer proporcionalmente." },
          { label: "Valores Próximos a -1,0 (Vermelho)", text: "Forte correlação inversa (ex: Temperatura vs Umidade Relativa: r = -0,85)." }
        ]} />
      </div>
    </>
  );
}

/* =========================================================
   09 — TORRES DE CAMPO (3D)
   =========================================================== */
function TorresSection({ data }){
  const { hasData, metadata, towerStatus } = data;
  const stageRef = useRef(null);
  const sceneHandle = useRef(null);

  useEffect(() => {
    if(!stageRef.current) return;
    sceneHandle.current = window.CajuCarbo.createTowerScene(stageRef.current, towerStatus.status || "operacional");
    return () => { if(sceneHandle.current) sceneHandle.current.dispose(); sceneHandle.current = null; };
  }, []);

  useEffect(() => {
    if(sceneHandle.current && towerStatus.status) sceneHandle.current.updateStatus(towerStatus.status);
  }, [towerStatus.status]);

  return (
    <>
      <Header n="09" t="Torres de Campo" d="Pontos de monitoramento instalados em campo e status real de telemetria, em modelo 3D interativo." />
      <div className="tower-section reveal">
        <div className="tower-stage" ref={stageRef}></div>
        <div className="tower-info">
          <h3>Torre Agrometeorológica — Campo Monitorado</h3>
          <p>Estação micrometeorológica e sensores de solo instalados na área experimental do projeto CajuCarbo, com transmissão contínua de parâmetros ambientais.</p>
          {hasData ? (
            <>
              <div className={"tower-status-row status-" + towerStatus.status}><span className="dot"></span> {window.CajuCarbo.TOWER_STATUS_LABEL[towerStatus.status]}</div>
              <div className="tower-mini-stats">
                <div><div className="v">{fmt((1-towerStatus.missingRatio)*100,0)}%</div><div className="l">Completude dos dados</div></div>
                <div><div className="v">{metadata.rowCount.toLocaleString("pt-BR")}</div><div className="l">Registros recebidos</div></div>
                <div><div className="v">{towerStatus.lastTimestamp ?? "—"}</div><div className="l">Última leitura</div></div>
              </div>
            </>
          ) : <p style={{color:"rgba(255,255,255,.4)", fontSize:13}}>Calculando status a partir dos dados recebidos...</p>}
        </div>
      </div>
      <div className="section-divider"></div>
      <div className="panel reveal">
        <div className="panel__title"><h3>Histórico Operacional da Estação</h3></div>
        {hasData ? <ObservatoryTimeline data={data} /> : <EmptyState title="Sem histórico disponível" desc="A linha do tempo é construída a partir dos dados carregados." />}
      </div>
    </>
  );
}

    ["6_ceara_vs_brasil_producao.html", "Participação Ceará vs. Brasil — Produção"],
    ["7_ceara_vs_brasil_area.html", "Participação Ceará vs. Brasil — Área"],
    ["8_ceara_vs_brasil_rendimento.html", "Comparativo Ceará vs. Brasil — Rendimento"],
  ];
  return (
    <>
      <Header n="▤" t="Produção Nacional de Castanha de Caju" d="Painéis analíticos da produção agrícola brasileira e cearense (dados IBGE/PAM), contextualizando o impacto socioeconômico da cultura." />
      <div className="grid grid-2 reveal-stagger">
        {items.map(([file, title]) => (
          <div className="panel" key={file}>
            <div className="panel__title"><h3>{title}</h3></div>
            <iframe src={"../" + file} className="embed-frame" title={title}></iframe>
          </div>
        ))}
      </div>
      <div className="panel reveal" style={{marginTop:20}}>
        <div className="panel__title"><h3>Produção Municipal no Ceará — 2024</h3></div>
        <iframe src="../9_municipios_ceara_2024.html" className="embed-frame tall" title="Municípios do Ceará"></iframe>
      </div>
    </>
  );
}

/* ---- Cabeçalho de seção reutilizável ---- */
function Header({ n, t, d }){
  return (
    <div className="view-header reveal">
      <div className="eyebrow">SEÇÃO {n}</div>
      <h1>{t}</h1>
      <p>{d}</p>
    </div>
  );
}

window.CajuCarbo = window.CajuCarbo || {};
Object.assign(window.CajuCarbo, {
  OverviewSection, CultivoSection, MeteorologiaSection, SoloSection, RadiacaoSection,
  AguaSection, EstatisticaSection, ModeloSection, TorresSection, RelatorioSection, ProducaoSection
});

})();
</script>

<script type="text/babel" data-presets="react">
(function(){
/* ---- App.jsx ---- */
/* =========================================================
   App.jsx
   Componente raiz: carrega os dados automaticamente (sem
   upload público — a importação de planilhas é restrita ao
   painel administrativo), controla navegação e renderiza a
   seção ativa.
   ========================================================= */

var { useEffect, useState } = React;
var CC = window.CajuCarbo;
var { Sidebar, Topbar, IntroOverlay, NAV_ITEMS, TemporalFilterBar, applyTemporalFilter, buildTemporalFilterOptions } = CC;

const EMPTY_DATA = {
  hasData: false,
  normalized: [],
  metadata: { fileName: null, rowCount: 0, columnCount: 0, periodStart: null, periodEnd: null },
  statistics: {},
  variables: { matched: {}, unmatched: [], byGroup: {} },
  towerStatus: { status: null, missingRatio: null, lastTimestamp: null },
};

const DEFAULT_DATASET_ID = CC.CC_DATASETS.find(d => d.status === "available")?.id || CC.CC_DATASETS[0].id;
const DEFAULT_FILTER = { granularity: "all", day: "", weekStart: "", weekEnd: "", month: "", year: "", customStart: "", customEnd: "", hourStart: "00:00", hourEnd: "23:59" };

function App(){
  const [introHidden, setIntroHidden] = useState(false);
  const [navOpen, setNavOpen] = useState(false);
  const [activeSection, setActiveSection] = useState("overview");
  const [datasetId, setDatasetId] = useState(DEFAULT_DATASET_ID);
  const [status, setStatus] = useState("loading"); // loading | ready | error
  const [data, setData] = useState(EMPTY_DATA);
  const [timeFilter, setTimeFilter] = useState(DEFAULT_FILTER);

  // ---- Intro: dispensa automaticamente após uma breve abertura ----
  useEffect(() => {
    const t = setTimeout(() => setIntroHidden(true), 2200);
    return () => clearTimeout(t);
  }, []);

  // ---- Carregamento do dataset selecionado no alternador ----
  useEffect(() => {
    let cancelled = false;
    const dataset = CC.CC_DATASETS.find(d => d.id === datasetId);
    if(!dataset || dataset.status !== "available") return;

    setStatus("loading");
    async function boot(){
      try{
        const parsed = await CC.loadSampleCSV(dataset.path);
        if(!parsed.rows.length) throw new Error("Dataset vazio.");

        const detected = CC.detectVariables(parsed.headers);
        const normBase = CC.normalizeData(parsed.rows, detected.matched);
        const normalized = CC.calculateDerivedVariables(normBase);

        const metadata = {
          fileName: parsed.fileName,
          rowCount: parsed.rows.length,
          columnCount: parsed.headers.length,
          periodStart: normalized[0]?.timestamp ?? null,
          periodEnd: normalized[normalized.length-1]?.timestamp ?? null,
          datasetLabel: dataset.label,
        };

        const allFields = Object.keys(CC.NUMERIC_FIELD_LABELS);
        const statistics = CC.calculateStatistics(normalized, allFields);
        const towerStatus = CC.computeTowerStatus(normalized, CC.CORE_FIELDS_FOR_TOWER);
        const defaultOptions = buildTemporalFilterOptions(normalized);
        const firstDay = defaultOptions.days[0] || "";
        const lastDay = defaultOptions.days[defaultOptions.days.length - 1] || "";
        const firstMonth = defaultOptions.months[0] || "";
        const lastMonth = defaultOptions.months[defaultOptions.months.length - 1] || "";
        const firstYear = defaultOptions.years[0] ? String(defaultOptions.years[0]) : "";
        const lastYear = defaultOptions.years[defaultOptions.years.length - 1] ? String(defaultOptions.years[defaultOptions.years.length - 1]) : "";

        if(cancelled) return;
        setTimeFilter(prev => ({
          ...DEFAULT_FILTER,
          ...prev,
          granularity: "all",
          day: prev.day || lastDay,
          weekStart: prev.weekStart || firstDay,
          weekEnd: prev.weekEnd || lastDay,
          month: prev.month || lastMonth,
          year: prev.year || lastYear,
          customStart: prev.customStart || firstDay,
          customEnd: prev.customEnd || lastDay,
          hourStart: prev.hourStart || "00:00",
          hourEnd: prev.hourEnd || "23:59"
        }));
        setData({ hasData: true, normalized, metadata, statistics, variables: detected, towerStatus });
        setStatus("ready");
      } catch(err){
        console.error("Falha ao carregar dataset:", err);
        if(!cancelled) setStatus("error");
      }
    }
    boot();
    return () => { cancelled = true; };
  }, [datasetId]);

  // ---- Reveal-on-scroll a cada troca de seção ----
  useEffect(() => {
    const t = setTimeout(() => CC.initScrollReveal(), 30);
    window.scrollTo({ top: 0 });
    return () => clearTimeout(t);
  }, [activeSection, status]);

  useEffect(() => {
    if(!data.hasData || !data.normalized.length) return;
    const options = buildTemporalFilterOptions(data.normalized);
    const currentDay = options.days[options.days.length - 1] || "";
    const currentMonth = options.months[options.months.length - 1] || "";
    const currentYear = options.years[options.years.length - 1] || "";

    setTimeFilter(prev => ({
      ...DEFAULT_FILTER,
      ...prev,
      day: prev.day || currentDay,
      month: prev.month || currentMonth,
      year: prev.year || String(currentYear),
      weekStart: prev.weekStart || (options.days[0] || ""),
      weekEnd: prev.weekEnd || (options.days[options.days.length - 1] || ""),
      customStart: prev.customStart || (options.days[0] || ""),
      customEnd: prev.customEnd || (options.days[options.days.length - 1] || "")
    }));
  }, [data.hasData, data.normalized]);

  const activeItem = NAV_ITEMS.find(i => i.id === activeSection) || NAV_ITEMS[0];
  const filteredNormalized = data.hasData ? applyTemporalFilter(data.normalized, timeFilter) : [];
  const filteredStatistics = data.hasData && filteredNormalized.length
    ? CC.calculateStatistics(filteredNormalized, Object.keys(CC.NUMERIC_FIELD_LABELS))
    : {};
  const filteredTowerStatus = data.hasData && filteredNormalized.length
    ? CC.computeTowerStatus(filteredNormalized, CC.CORE_FIELDS_FOR_TOWER)
    : data.towerStatus;

  const filteredData = data.hasData ? {
    ...data,
    normalized: filteredNormalized,
    statistics: filteredStatistics,
    towerStatus: filteredTowerStatus,
    metadata: {
      ...data.metadata,
      rowCount: filteredNormalized.length,
      filteredRowCount: filteredNormalized.length,
      activeFilter: timeFilter
    }
  } : data;

  function renderSection(){
    switch(activeSection){
      case "overview": return <CC.OverviewSection data={filteredData} />;
      case "cultivo": return <CC.CultivoSection data={filteredData} />;
      case "meteorologia": return <CC.MeteorologiaSection data={filteredData} />;
      case "solo": return <CC.SoloSection data={filteredData} />;
      case "radiacao": return <CC.RadiacaoSection data={filteredData} />;
      case "agua": return <CC.AguaSection data={filteredData} />;
      case "stats": return <CC.EstatisticaSection data={filteredData} />;
      case "modelo": return <CC.ModeloSection data={filteredData} />;
      case "torres": return <CC.TorresSection data={filteredData} />;
      case "relatorio": return <CC.RelatorioSection data={filteredData} />;
      case "producao": return <CC.ProducaoSection />;
      default: return null;
    }
  }

  return (
    <>
      <IntroOverlay hidden={introHidden} />
      <div className="app-shell">
        {navOpen && <div className="nav-backdrop" onClick={() => setNavOpen(false)}></div>}
        <Sidebar
          active={activeSection}
          navOpen={navOpen}
          onSelect={(item) => { setActiveSection(item.id); setNavOpen(false); }}
        />
        <Topbar
          activeItem={activeItem}
          status={status}
          onToggleNav={() => setNavOpen(o => !o)}
          datasetId={datasetId}
          onDatasetChange={setDatasetId}
        />
        <main className="content">
          {status === "error" && (
            <div style={{
              margin: "16px 40px 0", padding: "12px 16px", background: "var(--vermelho-100)",
              color: "var(--vermelho-500)", border: "1px solid rgba(179,55,44,.25)",
              borderRadius: "6px", fontSize: 13
            }}>
              Não foi possível carregar automaticamente os dados. Se você abriu este arquivo
              diretamente do disco, sirva a pasta por um servidor local (por exemplo <code>npx serve</code> ou{" "}
              <code>python -m http.server</code>) e recarregue a página — navegadores bloqueiam essa leitura via
              <code>file://</code>.
            </div>
          )}
          {data.hasData && (
            <TemporalFilterBar
              rows={data.normalized}
              filter={timeFilter}
              datasetLabel={data.metadata.datasetLabel}
              onChange={setTimeFilter}
            />
          )}
          <section className="view is-active view-appear" key={activeSection + "|" + datasetId + "|" + JSON.stringify(timeFilter)}>
            {renderSection()}
          </section>
        </main>
      </div>
    </>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);

})();
</script>

</body>
</html>
